<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1221"><title>ShortCut AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1221;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:700px;margin:auto;padding:38px 20px 80px}header{display:flex;align-items:center;gap:12px}.logo{background:#44e0ad;color:#061a1e;padding:13px;border-radius:14px;font-weight:800}h1{margin:0;font-size:28px;letter-spacing:-1px}small,p{color:#a3b1c8}.card{background:#152237;border:1px solid #28374e;padding:22px;border-radius:22px;margin-top:24px}label{display:block;margin-bottom:10px;font-weight:600}.drop{display:flex;min-height:160px;border:2px dashed #45647a;border-radius:16px;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:#b6d5e2;background:#102035;padding:20px}input[type=file]{display:none}input[type=text],textarea{background:#0f1d31;color:#fff;border:1px solid #3e5068;border-radius:12px;padding:14px;width:100%;font-size:16px}textarea{resize:vertical}button{background:#43e0ae;color:#062722;border:0;padding:17px;border-radius:14px;width:100%;font-weight:750;font-size:17px;cursor:pointer}button:disabled{opacity:.45}.option{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.option label{margin:0}input[type=checkbox]{width:22px;height:22px;accent-color:#43e0ae}.status{margin-top:18px;color:#bbcbde;white-space:pre-wrap}.hidden{display:none}video{max-width:100%;border-radius:14px;max-height:400px}.note{font-size:13px;line-height:1.7}</style></head><body><main><header><div class="logo">AI</div><div><h1>ShortCut AI</h1><small>iPadのためのショート動画編集</small></div></header><section class="card"><h2>01　素材を選ぶ</h2><label class="drop" for="file"><span id="fileName">＋ 動画をアップロード<br><small>MP4 / MOV / WEBM・最大60MB / 90秒</small></span></label><input id="file" type="file" accept="video/*"><div id="preview" class="hidden" style="margin-top:16px"><video id="video" controls playsinline></video></div></section><section class="card"><h2>02　自動編集</h2><div class="option"><label for="silence">無音部分を自動カット</label><input id="silence" type="checkbox" checked></div><p class="note">縦横比は9:16に自動変換。横動画は余白をつけて全体が見えるようにする。</p><label for="caption">画面下に表示する字幕（任意）</label><textarea id="caption" rows="3" placeholder="ここに字幕を入力。日本語に対応"></textarea><p class="note">AIの文字起こしによる字幕の自動生成は次のアップデートで対応予定。</p></section><section class="card"><h2>03　書き出す</h2><button id="run">動画を自動編集する</button><div id="status" class="status"></div><a id="download" class="hidden" download="shortcut-ai-edited.mp4"><button type="button" style="margin-top:15px;background:#fff">完成動画を保存</button></a></section><p class="note">プライベート試作版。処理後の一時ファイルは削除されます。無料サーバーでは動画の処理が遅くなる場合があります。</p></main><script>const file=document.getElementById('file'),video=document.getElementById('video'),run=document.getElementById('run'),status=document.getElementById('status'),download=document.getElementById('download');file.addEventListener('change',()=>{let f=file.files[0];if(!f)return;document.getElementById('fileName').textContent=f.name;document.getElementById('preview').classList.remove('hidden');video.src=URL.createObjectURL(f);});run.onclick=async()=>{if(!file.files[0]){status.textContent='先に動画を選択してください。';return;}run.disabled=true;download.classList.add('hidden');status.textContent='動画を編集しています。画面は閉じずにお待ちください。';let data=new FormData;data.append('file',file.files[0]);data.append('remove_silence',document.getElementById('silence').checked);data.append('caption',document.getElementById('caption').value);try{let res=await fetch('/api/process',{method:'POST',body:data});if(!res.ok){let e=await res.json().catch(()=>({detail:res.status}));throw Error(e.detail)}let b=await res.blob();download.href=URL.createObjectURL(b);download.classList.remove('hidden');status.textContent='編集が完了しました！「完成動画を保存」を押してください。';}catch(e){status.textContent='エラー: '+e.message;}finally{run.disabled=false;}};</script></body></html>
